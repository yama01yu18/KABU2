name: KABU Monitor 2

on:
  schedule:
    # 日本時間 10:00 ごろに実行
    # GitHub Actions cronはUTC
    - cron: "0 8 * * *"

  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance resend openpyxl

      - name: Run KABU monitor
        env:
          RESEND_API: ${{ secrets.RESEND_API }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          python kabu2.py
